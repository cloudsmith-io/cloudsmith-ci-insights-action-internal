[project]
name = "package-insights"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "certifi==2025.8.3",
    "charset-normalizer==3.4.3",
    "click==8.2.1",
    "exceptiongroup==1.3.0",
    "idna==3.10",
    "iniconfig==2.1.0",
    "packaging==25.0",
    "pluggy==1.6.0",
    "pygments==2.19.2",
    "pytest==8.4.2",
    "requests==2.32.5",
    "tomli==2.2.1",
    "typing-extensions==4.15.0",
    "urllib3==2.5.0"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["package_insights*"]
exclude = ["tests*"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
